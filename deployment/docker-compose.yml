# ─── Kiến trúc: 4 service tách biệt ────────────────────────────────────────────
#
#  mediamtx            ← Điểm pull RTSP DUY NHẤT từ camera IP thật. application
#                         đăng ký/xóa path qua Control API (:9997) khi camera được
#                         thêm/xóa; deepstream-service luôn nhận URL trỏ vào đây,
#                         không bao giờ pull thẳng camera → tránh cạn kết nối camera.
#
#  deepstream-service  ← camera input (qua mediamtx) + AI inference (1 pipeline, NVMM nội bộ)
#
#  application         ← MQTT subscriber + FastAPI dashboard + business logic
#                         + điều phối add/remove camera (đăng ký mediamtx rồi mới
#                         gọi gRPC xuống deepstream-service)
#                         Expose REST API :8080
#
#  mqtt-broker         ← Eclipse Mosquitto (message bus giữa các service)
#
# ─── Dynamic camera: ─────────────────────────────────────────────────────────────
#   # Thêm camera (không restart):
#   curl -XPOST http://localhost:8080/cameras/add -H 'Content-Type: application/json' \
#        -d '{"url": "rtsp://<user>:<password>@<camera_ip>:<port>/stream"}'
#
#   # Xóa camera:
#   curl -XDELETE http://localhost:8080/cameras/2
# ─────────────────────────────────────────────────────────────────────────────────

services:

  # ── SERVICE 1: DeepStream (camera + inference) ──────────────────────────────
  deepstream-service:
    build:
      context: ..
      dockerfile: services/deepstream/Dockerfile
    image: headpose-deepstream:latest
    container_name: deepstream-service
    restart: unless-stopped
    network_mode: host          # cần để: (1) reach camera IP, (2) reach mqtt-broker localhost
    ipc: host                   # NVMM buffer sharing (cùng host process namespace)
    runtime: nvidia
    environment:
      # - DISPLAY=:1 # Commented out to run headless and avoid EGL display connection failure
      # Camera KHÔNG còn tự add ở đây bằng RTSP_URLS — application là nơi duy nhất
      # gọi AddCamera (sau khi đã đăng ký path qua mediamtx), xem CAMERA_URLS bên dưới.
      - MAX_CAMERAS=8             # Số camera tối đa (TRT batch size cứng)
      # AI Models
      - ONNX_MODEL_PATH=/models/mediapipe_pose/20_new_onnx_postprocess_N-batch/face_mesh_192x192_post.onnx
      - PEOPLENET_CONFIG=/models/peoplenet/config_infer_peoplenet.txt
      - TRT_ENGINE_PATH=/models/mediapipe_pose/20_new_onnx_postprocess_N-batch/face_mesh_192x192.onnx_b1_gpu0_fp16.engine
      # MQTT
      - MQTT_BROKER=127.0.0.1
      - MQTT_PORT=1883
      # Service config
      - USE_GPU_LANDMARK=1
      - AARCH64_IGPU=1
      - LOG_DIR=/logs
      - CAMERA_API_PORT=9001      # REST API cho camera management
      - PYTHONUNBUFFERED=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../models:/models
      - ../models:/app/models
      - ../log:/logs
    depends_on:
      - mqtt-broker

  # ── SERVICE 2: Application (business logic + API) ───────────────────────────
  application:
    build:
      context: ..
      dockerfile: services/application/Dockerfile
    image: headpose-application:latest
    container_name: headpose-application
    restart: unless-stopped
    network_mode: host          # dùng host để gọi deepstream-service :9001 trực tiếp
    environment:
      - MQTT_BROKER=127.0.0.1
      - MQTT_PORT=1883
      - DEEPSTREAM_GRPC_SERVER=127.0.0.1:50051
      - APP_PORT=8080
      - DEVICE_ID=jetson-edge
      # Alert thresholds
      - YAW_ALERT_DEG=45.0
      - PITCH_ALERT_DEG=30.0
      - ALERT_DURATION_S=3.0
      # mediamtx: nơi duy nhất kéo RTSP từ camera thật
      - MEDIAMTX_API=http://127.0.0.1:9997
      - MEDIAMTX_RTSP_HOST=127.0.0.1:8554
      # IP LAN thật của Jetson — viewer bên ngoài (laptop khác) dùng để pull video
      # qua mediamtx. Khai báo trong file .env (xem .env.example).
      - MEDIAMTX_PUBLIC_RTSP_HOST=${MEDIAMTX_PUBLIC_RTSP_HOST:-127.0.0.1:8554}
      # Camera add lúc khởi động — URL chứa credential nên KHÔNG hardcode ở đây.
      # Khai báo trong deployment/.env (đã gitignore, xem .env.example).
      - CAMERA_URLS=${CAMERA_URLS:-}

      # Optional: push log/alert đến VPS
      # - LOG_SERVER_URL=http://your-vps:5000/api/logs
    command: python3 main.py
    depends_on:
      - mqtt-broker
      - mediamtx
      - deepstream-service

  # ── SERVICE 3: MQTT Broker ──────────────────────────────────────────────────
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    restart: unless-stopped
    network_mode: host          # host mode để deepstream (host net) reach được
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  # ── SERVICE 4: MediaMTX (điểm pull RTSP duy nhất) ────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    network_mode: host          # host mode để deepstream-service (host net) reach được
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
