syntax = "proto3";

package camera;

// Dynamic camera management service for the DeepStream C++ service.
service CameraService {
    // Add a new RTSP camera to the running pipeline.
    rpc AddCamera (CameraAddRequest) returns (CameraAddResponse);

    // Remove a camera from the pipeline by ID.
    rpc RemoveCamera (CameraRemoveRequest) returns (CameraRemoveResponse);

    // List currently active cameras.
    rpc ListCameras (CameraListRequest) returns (CameraListResponse);
}

message CameraAddRequest {
    string url = 1;
}

message CameraAddResponse {
    int32 src_id = 1;
    string url = 2;
    string status = 3; // "added", "failed", "exists"
}

message CameraRemoveRequest {
    int32 src_id = 1;
}

message CameraRemoveResponse {
    int32 src_id = 1;
    string status = 2; // "removed", "not_found", "failed"
}

message CameraListRequest {}

message CameraInfo {
    int32 src_id = 1;
    string url = 2;
}

message CameraListResponse {
    repeated CameraInfo cameras = 1;
}
