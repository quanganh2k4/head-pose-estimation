# Pipeline Configuration Example
pipeline:
  max_cameras: 8
  stream_mux:
    width: 1920
    height: 1080
    batch_timeout_usec: 40000
    batched_push_timeout: 40000

models:
  primary_detector:
    name: "peoplenet"
    config_file: "models/peoplenet/config_infer_peoplenet.txt"
  secondary_detector:
    name: "facemesh"
    onnx_path: "models/mediapipe_pose/20_new_onnx_postprocess_N-batch/face_mesh_192x192_post.onnx"
    engine_path: "models/mediapipe_pose/20_new_onnx_postprocess_N-batch/face_mesh_192x192.onnx_b1_gpu0_fp16.engine"
    input_shape: [1, 3, 192, 192]

tracker:
  ll_config_file: "/opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvDCF_perf.yml"
  ll_lib_file: "/opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so"

mqtt:
  broker: "127.0.0.1"
  port: 1883
  topic_metadata_prefix: "gaze"
  topic_calculated_prefix: "gaze"

algorithms:
  spherical_morphing:
    enabled: true
  one_euro_filter:
    min_cutoff: 1.0
    beta: 0.007
    d_cutoff: 1.0
  alert:
    yaw_threshold_deg: 45.0
    pitch_threshold_deg: 30.0
    duration_seconds: 3.0
