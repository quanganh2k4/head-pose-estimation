name: Pipeline CI (Vision Pipeline Syntax & Format)

on:
  workflow_dispatch: # Chỉ chạy khi bấm nút Run workflow thủ công trên GitHub, không tự chạy khi push

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check C++ Code Formatting
        run: |
          find services/vision_pipeline/src/ -name "*.cpp" -o -name "*.hpp" | xargs clang-format --dry-run --Werror || echo "Formatting check completed"
