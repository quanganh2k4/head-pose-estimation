name: Deploy Archify diagrams

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-diagrams.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp headpose-architecture.html headpose-sequence.html _site/
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Headpose Camera IP diagrams</title><h1>Headpose Camera IP</h1><ul><li><a href="headpose-architecture.html">Architecture diagram</a></li><li><a href="headpose-sequence.html">Sequence diagram</a></li></ul>' > _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
