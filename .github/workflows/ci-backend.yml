name: Backend CI (Analytics API)

on:
  workflow_dispatch: # Chỉ chạy khi bấm nút Run workflow thủ công trên GitHub, không tự chạy khi push

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest numpy scipy pydantic fastapi paho-mqtt requests grpcio protobuf

      - name: Lint with Ruff
        run: |
          ruff check services/analytics_api/ tools/

      - name: Run Algorithm & API Unit Tests
        run: |
          pytest services/analytics_api/tests/ -v
