name: Docker Build Validation

on:
  workflow_dispatch: # Chỉ chạy khi bấm nút Run workflow thủ công trên GitHub, không tự chạy khi push

jobs:
  build-analytics-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Analytics API Docker Image
        run: |
          docker build -t headpose-analytics-api:test -f services/analytics_api/Dockerfile .
