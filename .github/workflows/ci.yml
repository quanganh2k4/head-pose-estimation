name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Thuật toán head pose là phần thuần Python (numpy/scipy) nên test được trên
  # runner thường — các phần cần GPU/DeepStream (C++ service) chỉ build được
  # trên Jetson nên không đưa vào CI.
  algorithm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install numpy scipy pytest ruff

      - name: Lint (syntax errors & undefined names)
        run: ruff check --select E9,F63,F7,F82 services/ gaze_viewer.py

      - name: Run unit tests
        run: pytest services/application/tests/ -v
